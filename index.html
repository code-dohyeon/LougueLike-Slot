<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated title -->
    <title>Slot Machine Roguelike</title>
    <link rel="stylesheet" href="./css/style.css">

    <script type="module" src="./js/data.js"></script>
    <script type="module" src="./js/item.js"></script>
    <script type="module" src="./js/slotMachine.js"></script>
    <script type="module" src="./js/gameManager.js"></script>
    <script type="module" src="./js/monster.js"></script>
    <script type="module" src="./js/player.js"></script>
    <script type="module" src="./js/index.js"></script>
</head>
<body>
    <!-- Added main game wrapper for better layout -->
     <div id="initial-setup-container" class="initial-setup-container" style="display: none;">
        <h2 class="setup-title">무기 3개 선택 후 게임 시작!</h2>
        <div id="weapon-selection-div" class="weapon-selection-grid">
            </div>
        <button id="select-weapons-btn" class="btn btn-start" disabled>무기 0/3개 선택</button>
    </div>

    <div class="game-wrapper">
        <div id="clear_text" class="clear-text" style="display: none;"></div>
        
        <div id="game-status" class="game-status">
            <div id="monster-info" class="monster-info"></div> 
            <div id="monster-hp-bar" class="monster-hp-bar"> 
                <div id="monster-hp-fill" class="monster-hp-fill"></div> 
            </div>
        </div>

        <div id="player-status" class="player-status">
            <div class="stat-item">
                <span class="stat-label">HP</span>
                <span id="player-hp-value" class="stat-value"></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Shield</span>
                <span id="player-df" class="stat-value"></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Gold</span>
                <span id="player-gold" class="stat-value"></span>
            </div>
        </div>

        <div id="game-info" class="game-info">
            <span class="stage-label">Stage</span>
            <span id="stage-value" class="stage-value">1</span> 
        </div>

        <div id="shop-container" class="shop-container" style="display: none;"> 
            <h2 class="shop-title">스테이지 클리어!</h2>
            <p class="shop-gold">현재 골드: <span id="shop-gold-value" class="gold-highlight">0</span></p>
            <div class="shop-buttons">
                <button id="upgrade-hp-btn" class="btn btn-upgrade">최대 HP +10 (50 Gold)</button>
                <button id="upgrade-slot-btn" class="btn btn-upgrade" disabled>슬롯 개수 +1 (100 Gold)</button>
                <button id="next-stage-btn" class="btn btn-next">다음 전투로 🚀</button>
            </div>
        </div>

        <div id="slot-container" class="slot-container">
            <div class="slot-reel-container">
                <div id="reel-1" class="slot-reel">?</div>
            </div>
            <div class="slot-reel-container">
                <div id="reel-2" class="slot-reel">?</div>
            </div>
            <div class="slot-reel-container">
                <div id="reel-3" class="slot-reel">?</div>
            </div>
            <div class="slot-reel-container">
                <div id="reel-4" class="slot-reel">?</div>
            </div>
            <div class="slot-reel-container">
                <div id="reel-5" class="slot-reel">?</div>
            </div>
        </div>

        <div class="button-container">
            <button id="spin-button" class="btn btn-spin">턴 진행 (슬롯 돌리기)</button>
            <button id="restart-button" class="btn btn-restart" style="display: none;">게임 재시작</button>
        </div>
    </div>
</body>
</html>
